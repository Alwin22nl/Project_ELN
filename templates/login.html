{% extends "base.html" %}

{% block title %}
Zettex ELN
{% endblock %}

{% block content %}

<h1>Laboratory Login</h1>

<div class="login-container">
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>
         Username
        </label>

        <br>

        <input
        type="text"
        name="username"
        required>

        <br><br>

        <label>
            Password
        </label>

        <br>

        <input
        type="password"
        name="password"
        required>

        <br><br>

        <button type="submit">
            Login
        </button>
    </form>
</div>

{% endblock %}
