<h1>Create New User</h1>


<form method="POST">

<label>
Username
</label>

<input 
type="text"
name="username"
required>


<br>


<label>
Full name
</label>

<input 
type="text"
name="name"
required>


<br>


<label>
Role
</label>

<select name="user_role">

<option value="QC">
QC 
</option>

<option value="R&D">
R&D 
</option>

<option value="admin">
Admin
</option>

<option value="MANAGEMENT">
Management
</option>

<option value="SALES">
Sales
</option>

</select>


<br>


<button type="submit">
Create User
</button>


</form>
