{% extends "base.html" %}

{% block content %}

<div class="change-request-container">

    <h1>Wijziging aanvragen</h1>
    <p>
        Gebruik dit formulier om een wijziging van een bestaand resultaat
        aan te vragen.
    </p>
    <form method="POST">

        <div class="form-group">
            <label for="table_name">Tabel</label>

            <input
                type="text"
                id="table_name"
                name="table_name"
                value="{{ request.form.get('table_name', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="record_id">Record ID</label>

            <input
                type="number"
                id="record_id"
                name="record_id"
                value="{{ request.form.get('record_id', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="field_name">Veld</label>

            <input
                type="text"
                id="field_name"
                name="field_name"
                value="{{ request.form.get('field_name', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="old_value">Huidige waarde</label>

            <input
                type="text"
                id="old_value"
                name="old_value"
                value="{{ request.form.get('old_value', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="new_value">Nieuwe waarde</label>

            <input
                type="text"
                id="new_value"
                name="new_value"
                value="{{ request.form.get('new_value', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="reason">Reden voor wijziging</label>

            <textarea
                id="reason"
                name="reason"
                rows="5"
                required
            >{{ request.form.get('reason', '') }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit">
                Wijziging aanvragen
            </button>
        </div>
    </form>
</div>

{% endblock %}
